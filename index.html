<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="张沐熙课程表">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>张沐熙的学习课程表</title>
<style>
  :root{
    --ink:#1f2430; --muted:#8a93a6; --line:#e8ebf1; --card:#ffffff;
    --bg1:#eef2fb; --bg2:#f7f5fb; --accent:#6366f1;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; padding:28px 20px 60px;
  }
  .wrap{max-width:1140px; margin:0 auto;}

  .topbar{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; margin-bottom:20px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .logo{width:52px; height:52px; border-radius:15px; background:linear-gradient(135deg,#6366f1,#a855f7); display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; box-shadow:0 8px 20px rgba(99,102,241,.35);}
  .brand h1{font-size:22px; font-weight:800; letter-spacing:.5px;}
  .brand p{font-size:13px; color:var(--muted); margin-top:2px;}
  .clock{text-align:right;}
  .clock .time{font-size:36px; font-weight:800; letter-spacing:1px; font-variant-numeric:tabular-nums;}
  .clock .date{font-size:13px; color:var(--muted); margin-top:2px;}

  /* week selector */
  .weekbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .weekbar .lbl{font-size:13px; font-weight:700; color:var(--muted); margin-right:4px;}
  .wk-chip{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:13px; font-weight:700; cursor:pointer; transition:.15s;}
  .wk-chip:hover{border-color:#c7d2fe; background:#f5f6ff;}
  .wk-chip.active{background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(99,102,241,.3);}
  .wk-chip.wknd{opacity:.85;}

  .hero{background:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7); color:#fff; border-radius:22px; padding:26px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:18px; box-shadow:0 16px 40px rgba(99,102,241,.35); margin-bottom:20px;}
  .hero .left{display:flex; flex-direction:column; gap:8px;}
  .hero .status{font-size:15px; opacity:.9; font-weight:600; letter-spacing:1px;}
  .hero .subject{font-size:32px; font-weight:800;}
  .hero .meta{font-size:14px; opacity:.92;}
  .hero .right{text-align:right;}
  .hero .count-label{font-size:12px; opacity:.85; letter-spacing:1px;}
  .hero .countdown{font-size:40px; font-weight:800; font-variant-numeric:tabular-nums;}
  .hero .count-sub{font-size:13px; opacity:.9; margin-top:2px;}

  .cards{display:grid; grid-template-columns:1fr; gap:20px;}
  @media(min-width:900px){ .cards{grid-template-columns: 1.05fr .95fr;} }

  .card{background:var(--card); border-radius:20px; padding:22px 24px; box-shadow:0 6px 24px rgba(31,36,48,.06); border:1px solid var(--line);}
  .card h2{font-size:17px; font-weight:800; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .card h2 .dot{width:8px; height:8px; border-radius:50%; background:#6366f1;}
  .card h2 .hint{font-size:12px; font-weight:500; color:var(--muted); margin-left:auto;}

  /* timeline */
  .timeline{display:flex; flex-direction:column; gap:10px;}
  .tl-item{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:14px; border:1px solid var(--line); background:#fbfcfe; transition:.15s; cursor:pointer;}
  .tl-item:hover{border-color:#c7d2fe;}
  .tl-item.now{border-color:#6366f1; background:#f5f6ff; box-shadow:0 4px 14px rgba(99,102,241,.16);}
  .tl-item.hl{outline:2px solid #a855f7; outline-offset:-2px;}
  .tl-item.done .tl-info .nm, .tl-item.done .tl-badge{opacity:.5; text-decoration:line-through;}
  .tl-check{width:22px; height:22px; border-radius:50%; border:2px solid #d3d8e2; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; cursor:pointer; transition:.15s;}
  .tl-check.on{background:#10b981; border-color:#10b981;}
  .tl-check.review{background:#f59e0b; border-color:#f59e0b;}
  .tl-time{min-width:96px; font-size:12px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1.4;}
  .tl-badge{min-width:70px; text-align:center; padding:5px 8px; border-radius:9px; font-size:13px; font-weight:700;}
  .tl-info{flex:1;}
  .tl-info .nm{font-size:14px; font-weight:700;}
  .tl-info .tc{font-size:12px; color:var(--muted); margin-top:1px;}
  .tl-state{font-size:11px; font-weight:700; color:#6366f1; white-space:nowrap;}
  .empty-hint{color:var(--muted); font-size:13px; padding:8px 4px;}

  /* table */
  .tbl-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:separate; border-spacing:0;}
  th,td{border:1px solid var(--line);}
  thead th{background:#f6f7fb; font-size:13px; font-weight:800; padding:10px 8px; position:sticky; top:0;}
  thead th.today{background:#eef0ff; color:#6366f1;}
  .tbl-wrap table{min-width:660px;}
  .period-col{background:#fafbfd; text-align:center; min-width:60px; padding:8px 6px;}
  .period-col .pn{font-weight:800; font-size:12px;}
  .period-col .pt{color:var(--muted); font-size:10px; font-variant-numeric:tabular-nums; margin-top:2px; white-space:nowrap;}
  .grp-row td{background:#f2f4fa; font-weight:800; font-size:13px; padding:6px 12px; text-align:left; color:#5b6472; letter-spacing:2px;}
  td.cell{vertical-align:middle; padding:0; position:relative; cursor:pointer; transition:.12s;}
  td.cell:hover{filter:brightness(.96);}
  td.cell.hl{outline:2px solid #a855f7; outline-offset:-2px; z-index:2;}
  td.cell.todaycol{box-shadow:inset 0 0 0 2px #c7d2fe;}
  .cell-inner{padding:9px 8px; text-align:center; min-height:52px; display:flex; flex-direction:column; justify-content:center;}
  .cell-inner .sub{font-weight:800; font-size:13px;}
  .cell-inner .t{font-size:11px; opacity:.85; margin-top:2px;}
  .cell-inner .note{font-size:10px; opacity:.75; margin-top:1px;}
  .cell-inner .dbl{position:absolute; top:3px; right:3px; font-size:9px; font-weight:800; padding:1px 5px; border-radius:6px; background:rgba(99,102,241,.18); color:#6366f1;}
  .empty{color:#c5cad6;}

  /* legend */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .chip{display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius:999px; font-size:12px; font-weight:700; cursor:pointer; transition:.12s;}
  .chip:hover{filter:brightness(.95);}
  .chip.hl{outline:2px solid #a855f7; outline-offset:1px;}

  /* stats */
  .stats{display:flex; flex-direction:column; gap:9px;}
  .stat-row{display:flex; align-items:center; gap:10px;}
  .stat-row .lb{min-width:52px; font-size:12px; font-weight:700; color:var(--muted);}
  .stat-row .bar{flex:1; height:14px; background:#f0f2f7; border-radius:999px; overflow:hidden;}
  .stat-row .fill{height:100%; border-radius:999px;}
  .stat-row .cnt{min-width:26px; text-align:right; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums;}

  /* study progress */
  .study-ring{display:flex; align-items:center; gap:18px; margin-bottom:16px;}
  .ring{position:relative; width:96px; height:96px; flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .ring-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ring .ring-num .big{font-size:22px; font-weight:800;}
  .ring .ring-num .small{font-size:11px; color:var(--muted);}
  .study-summary{flex:1;}
  .study-summary .line{font-size:14px; margin-bottom:5px;}
  .study-summary .line b{font-weight:800;}
  .week-mini{display:flex; gap:6px; margin-bottom:16px;}
  .wm{flex:1; text-align:center; padding:8px 4px; border-radius:10px; border:1px solid var(--line); background:#fbfcfe;}
  .wm .wd{font-size:12px; font-weight:700; color:var(--muted);}
  .wm .pct{font-size:16px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums;}
  .wm .n{font-size:10px; color:var(--muted); margin-top:1px;}
  .wm.today{border-color:#6366f1; background:#f5f6ff;}
  .wm.done-all{background:#ecfdf5; border-color:#a7f3d0;}
  .study-list{display:flex; flex-direction:column; gap:8px; max-height:340px; overflow-y:auto;}
  .study-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; border:1px solid var(--line); background:#fbfcfe; cursor:pointer; transition:.12s;}
  .study-row:hover{border-color:#c7d2fe;}
  .study-row .s-dot{width:20px; height:20px; border-radius:50%; border:2px solid #d3d8e2; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; transition:.15s;}
  .study-row .s-dot.done{background:#10b981; border-color:#10b981;}
  .study-row .s-dot.review{background:#f59e0b; border-color:#f59e0b;}
  .study-row .s-name{flex:1; font-size:14px; font-weight:700;}
  .study-row .s-tag{font-size:11px; font-weight:700; padding:3px 8px; border-radius:7px; flex-shrink:0;}

  /* todo */
  .todo-add{display:flex; gap:8px; margin-bottom:14px;}
  .todo-add input{flex:1; padding:10px 14px; border:1px solid var(--line); border-radius:12px; font-size:14px; outline:none; font-family:inherit;}
  .todo-add input:focus{border-color:#c7d2fe;}
  .btn{background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:12px; padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer; transition:.15s; font-family:inherit; white-space:nowrap;}
  .btn:hover{filter:brightness(1.05);}
  .btn.ghost{background:#f1f3f8; color:var(--ink);}
  .todo-list{display:flex; flex-direction:column; gap:8px; max-height:360px; overflow-y:auto;}
  .todo-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:#fbfcfe;}
  .todo-item .cb{width:20px; height:20px; border-radius:6px; border:2px solid #d3d8e2; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; transition:.15s;}
  .todo-item .cb.on{background:#10b981; border-color:#10b981;}
  .todo-item .tx{flex:1; font-size:14px;}
  .todo-item .tx.done{text-decoration:line-through; color:var(--muted);}
  .todo-item .sub-tag{font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; flex-shrink:0;}
  .todo-item .del{color:#c5cad6; cursor:pointer; font-size:16px; padding:0 4px; flex-shrink:0;}
  .todo-item .del:hover{color:#ef4444;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(31,36,48,.45); backdrop-filter:blur(2px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:#fff; border-radius:20px; width:100%; max-width:400px; box-shadow:0 24px 60px rgba(0,0,0,.25); overflow:hidden; animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.95); opacity:0;} to{transform:scale(1); opacity:1;}}
  .m-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px 12px;}
  .m-sub{font-size:20px; font-weight:800;}
  .m-close{width:32px; height:32px; border-radius:10px; border:none; background:#f1f3f8; font-size:18px; cursor:pointer; color:var(--muted);}
  .m-close:hover{background:#e5e8ef;}
  .m-body{padding:4px 20px 18px;}
  .m-row{display:flex; gap:10px; font-size:14px; padding:7px 0; border-bottom:1px dashed var(--line);}
  .m-row:last-child{border-bottom:none;}
  .m-row .k{color:var(--muted); min-width:52px;}
  .m-row .v{font-weight:600;}
  .m-actions{display:flex; gap:10px; padding:0 20px 20px;}
  .m-actions .btn{flex:1; text-align:center;}

  .foot{margin-top:26px; text-align:center; color:var(--muted); font-size:12px; line-height:1.8;}

  /* ============ 手机端适配 ============ */
  @media(max-width:600px){
    body{padding:16px 12px 40px;}
    .topbar{margin-bottom:14px;}
    .logo{width:42px; height:42px; border-radius:12px; font-size:21px;}
    .brand h1{font-size:18px;}
    .brand p{font-size:11px;}
    .clock .time{font-size:26px;}
    .clock .date{font-size:11px;}
    .weekbar{flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch;}
    .weekbar .lbl{flex-shrink:0;}
    .wk-chip{flex-shrink:0; padding:7px 12px; font-size:12px;}
    .hero{padding:20px; border-radius:18px;}
    .hero .left{width:100%;}
    .hero .right{width:100%; text-align:left;}
    .hero .subject{font-size:24px;}
    .hero .countdown{font-size:30px;}
    .card{padding:16px; border-radius:16px;}
    .card h2{font-size:15px;}
    .tl-item{gap:9px; padding:10px;}
    .tl-time{min-width:74px; font-size:11px;}
    .tl-badge{min-width:60px; font-size:12px; padding:4px 6px;}
    .tl-info .nm{font-size:13px;}
    .tl-state{display:none;}
    .tl-check{width:26px; height:26px; flex-shrink:0;}
    .tbl-wrap table{min-width:560px;}
    .study-ring{flex-direction:column; align-items:flex-start; gap:12px;}
    .study-summary{width:100%;}
    .week-mini{gap:4px;}
    .wm .pct{font-size:13px;}
    .btn{padding:11px 14px; font-size:14px;}
    .todo-add input{font-size:16px;}  /* 防止 iOS 缩放 */
    .modal{max-width:92vw;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">🎵</div>
      <div>
        <h1>张沐熙的学习课程表</h1>
        <p>连堂合并 · 可交互 · 手机自适应</p>
      </div>
    </div>
    <div class="clock">
      <div class="time" id="clockTime">--:--:--</div>
      <div class="date" id="clockDate">—</div>
    </div>
  </div>

  <div class="weekbar">
    <span class="lbl">查看：</span>
    <button class="wk-chip" data-dow="-1">今天</button>
    <button class="wk-chip" data-dow="1">周一</button>
    <button class="wk-chip" data-dow="2">周二</button>
    <button class="wk-chip" data-dow="3">周三</button>
    <button class="wk-chip" data-dow="4">周四</button>
    <button class="wk-chip" data-dow="5">周五</button>
    <button class="wk-chip wknd" data-dow="6">周六</button>
    <button class="wk-chip wknd" data-dow="0">周日</button>
  </div>

  <div class="hero" id="hero">
    <div class="left">
      <div class="status" id="heroStatus">加载中…</div>
      <div class="subject" id="heroSubject">—</div>
      <div class="meta" id="heroMeta">—</div>
    </div>
    <div class="right">
      <div class="count-label" id="countLabel">倒计时</div>
      <div class="countdown" id="countDown">--:--:--</div>
      <div class="count-sub" id="countSub">—</div>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <h2><span class="dot"></span>今日课程 <span class="hint" id="dayHint">点击课程看详情 · 点○标记完成</span></h2>
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="card">
      <h2><span class="dot"></span>本周课表 <span class="hint">点击任意课程查看/操作</span></h2>
      <div class="tbl-wrap" id="tblWrap"></div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div class="cards" style="margin-top:20px;">
    <div class="card">
      <h2><span class="dot"></span>学习完成情况 <span class="hint">点○切换：未学 → 掌握 → 需复习</span></h2>
      <div class="study-ring" id="studyRing"></div>
      <div class="week-mini" id="weekMini"></div>
      <div class="study-list" id="studyList"></div>
    </div>
    <div class="card">
      <h2><span class="dot"></span>待办清单 <span class="hint">数据自动保存在本机</span></h2>
      <div class="todo-add">
        <input id="todoInput" placeholder="添加作业 / 待办事项…" maxlength="60">
        <button class="btn" id="todoBtn">添加</button>
      </div>
      <div class="todo-list" id="todoList"></div>
    </div>
  </div>

  <div class="foot">
    数据来源：初一一班课程表（含连堂合并）<br>
    连堂课以整块显示；点击课表/今日课程可查看详情、加入待办、高亮同科目。
  </div>
</div>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-head">
      <div class="m-sub" id="mSub">—</div>
      <button class="m-close" id="mClose">×</button>
    </div>
    <div class="m-body">
      <div class="m-row"><span class="k">老师</span><span class="v" id="mTeacher">—</span></div>
      <div class="m-row"><span class="k">时间</span><span class="v" id="mTime">—</span></div>
      <div class="m-row"><span class="k">节次</span><span class="v" id="mPeriod">—</span></div>
      <div class="m-row" id="mNoteRow"><span class="k">备注</span><span class="v" id="mNote">—</span></div>
    </div>
    <div class="m-actions">
      <button class="btn" id="mTodo">＋ 加到待办</button>
      <button class="btn ghost" id="mHighlight">✨ 高亮此科目</button>
    </div>
  </div>
</div>

<script>
// ================= 数据 =================
const WEEKCN = ["日","一","二","三","四","五","六"];

const PERIODS = [
  {n:1, grp:"上午", s:"08:00", e:"08:40"},
  {n:2, grp:"上午", s:"08:50", e:"09:30"},
  {n:3, grp:"上午", s:"09:40", e:"10:20"},
  {n:4, grp:"上午", s:"10:50", e:"11:30"},
  {n:5, grp:"上午", s:"11:40", e:"12:20"},
  {n:6, grp:"下午", s:"14:00", e:"14:40"},
  {n:7, grp:"下午", s:"14:50", e:"15:30"},
  {n:8, grp:"下午", s:"15:40", e:"16:20"},
  {n:9, grp:"下午", s:"16:30", e:"17:10"},
  {n:10, grp:"下午", s:"17:20", e:"18:00"},
  {n:11, grp:"下午", s:"18:10", e:"18:50"},
];

// 每天课程：{sub,t,note,start,end,p(起始节0-based),span(占节数)}
// 连堂课已合并为一条，span 表示占几个节次
const DAYS_COURSES = [
  /* 周一 */ [
    {sub:"地理", t:"周伟", note:null, start:"08:00", end:"08:40", p:0, span:1},
    {sub:"历史", t:"庄珊曼", note:null, start:"08:50", end:"09:30", p:1, span:1},
    {sub:"语文", t:"宗学文", note:null, start:"09:40", end:"10:20", p:2, span:1},
    {sub:"英语", t:"薛心怡", note:null, start:"10:50", end:"11:30", p:3, span:1},
    {sub:"政治", t:"郭红", note:null, start:"11:40", end:"12:20", p:4, span:1},
    {sub:"基乐2", t:"郑梦子", note:"视一", start:"15:40", end:"16:20", p:7, span:1},
    {sub:"基乐1", t:"郑梦子", note:"视一", start:"16:30", end:"17:10", p:8, span:1},
  ],
  /* 周二 */ [
    {sub:"语文", t:"宗学文", note:null, start:"08:00", end:"08:40", p:0, span:1},
    {sub:"地理", t:"周伟", note:null, start:"08:50", end:"09:30", p:1, span:1},
    {sub:"数学", t:"于蕊", note:"连堂", start:"09:40", end:"11:30", p:2, span:2},
    {sub:"体育", t:null, note:null, start:"11:40", end:"12:20", p:4, span:1},
    {sub:"板胡", t:"晏璐婷", note:"13:50—15:10", start:"13:50", end:"15:10", p:5, span:2},
  ],
  /* 周三 */ [
    {sub:"语文", t:"宗学文", note:"连堂", start:"08:00", end:"09:30", p:0, span:2},
    {sub:"历史", t:"庄珊曼", note:null, start:"09:40", end:"10:20", p:2, span:1},
    {sub:"数学", t:"于蕊", note:null, start:"10:50", end:"11:30", p:3, span:1},
    {sub:"英语", t:"薛心怡", note:null, start:"11:40", end:"12:20", p:4, span:1},
    {sub:"合奏", t:"高怡然", note:"二层排练厅", start:"15:40", end:"17:10", p:7, span:2},
  ],
  /* 周四 */ [
    {sub:"数学", t:"于蕊", note:null, start:"08:00", end:"08:40", p:0, span:1},
    {sub:"政治", t:"郭红", note:null, start:"08:50", end:"09:30", p:1, span:1},
    {sub:"体育", t:null, note:null, start:"09:40", end:"10:20", p:2, span:1},
    {sub:"英语", t:"薛心怡", note:"连堂", start:"10:50", end:"12:20", p:3, span:2},
  ],
  /* 周五 */ [
    {sub:"基乐1", t:"郑梦子", note:"视三 · 连堂", start:"08:00", end:"09:30", p:0, span:2},
    {sub:"基乐2", t:"郑梦子", note:"视三 · 连堂", start:"09:40", end:"11:30", p:2, span:2},
  ],
];

const COLORS = {
  "语文":{bg:"#fde2e2", fg:"#b91c1c"},
  "数学":{bg:"#dbeafe", fg:"#1d4ed8"},
  "英语":{bg:"#d1fae5", fg:"#047857"},
  "地理":{bg:"#ffedd5", fg:"#c2410c"},
  "历史":{bg:"#ede9fe", fg:"#6d28d9"},
  "政治":{bg:"#fee2e2", fg:"#9f1239"},
  "体育":{bg:"#cffafe", fg:"#0e7490"},
  "基乐1":{bg:"#fce7f3", fg:"#be185d"},
  "基乐2":{bg:"#fbcfe8", fg:"#db2777"},
  "板胡":{bg:"#e0e7ff", fg:"#4338ca"},
  "合奏":{bg:"#fef3c7", fg:"#b45309"},
};
function colorOf(sub){
  if(COLORS[sub]) return COLORS[sub];
  if(sub.startsWith("基乐")) return {bg:"#fbcfe8", fg:"#db2777"};
  return {bg:"#eef0f6", fg:"#5b6472"};
}

// ================= 状态 =================
let selectedDow = null;      // null=跟随今天; 0-6 指定
let highlightSub = null;     // 高亮的科目
let currentCourse = null;    // 当前 modal 课程
let todos = loadJSON('cw_todos', []);
let studySet = loadJSON('cw_study', {});   // { dateStr: { courseKey: 'done'|'review' } }

function loadJSON(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function todayDow(){ return selectedDow!==null ? selectedDow : new Date().getDay(); }
function dateStrForDow(dow){
  const now = new Date();
  const d = new Date(now);
  d.setDate(now.getDate() + (dow - now.getDay()));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function selectedDateStr(){ return dateStrForDow(todayDow()); }
function doneKey(c){ return `${c.sub}|${c.start}|${c.p}`; }
function getStudyStatus(c){
  const map = studySet[selectedDateStr()] || {};
  return map[doneKey(c)] || null;
}
function setStudyStatus(c){
  const ds = selectedDateStr();
  if(!studySet[ds]) studySet[ds] = {};
  const k = doneKey(c);
  const cur = studySet[ds][k] || null;
  if(cur===null) studySet[ds][k] = 'done';
  else if(cur==='done') studySet[ds][k] = 'review';
  else delete studySet[ds][k];
  saveJSON('cw_study', studySet);
  renderStudy();
  renderTimeline();
}

function tm(hhmm){ const [h,m]=hhmm.split(":").map(Number); return h*60+m; }
function fmtDur(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const p = n => String(n).padStart(2,"0");
  return h>0 ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
}
function periodLabel(c){
  return c.span>1 ? `第${PERIODS[c.p].n}—${PERIODS[c.p+c.span-1].n}节` : `第${PERIODS[c.p].n}节`;
}

// ================= 渲染：时钟 & hero =================
function tick(){
  const now = new Date();
  const t = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":");
  document.getElementById("clockTime").textContent = t;
  document.getElementById("clockDate").textContent =
    `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 星期${WEEKCN[now.getDay()]}`;
  renderHero(now);
}

function renderHero(now){
  const hero = document.getElementById("hero");
  const stEl = document.getElementById("heroStatus");
  const subEl = document.getElementById("heroSubject");
  const metaEl = document.getElementById("heroMeta");
  const cLabel = document.getElementById("countLabel");
  const cDown = document.getElementById("countDown");
  const cSub = document.getElementById("countSub");

  const dow = todayDow();
  const mins = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;

  if(dow===0 || dow===6){
    hero.style.background = "linear-gradient(135deg,#334155,#475569)";
    stEl.textContent = "周末休息";
    subEl.textContent = "今天没有课 🎉";
    metaEl.textContent = "好好休息，或练琴复习";
    cLabel.textContent = "距下周一";
    const nextMon = new Date(now);
    const add = dow===0 ? 1 : 8 - dow;
    nextMon.setDate(now.getDate()+add); nextMon.setHours(8,0,0,0);
    cDown.textContent = fmtDur((nextMon-now)/1000);
    cSub.textContent = "第一节 · 08:00";
    return;
  }

  const courses = DAYS_COURSES[dow-1];
  let current=null, next=null;
  for(const c of courses){
    const st=tm(c.start), en=tm(c.end);
    if(mins>=st && mins<en){ current=c; break; }
    if(mins<st){ next=c; break; }
  }

  if(current){
    const c = colorOf(current.sub);
    hero.style.background = `linear-gradient(135deg,${c.fg},${c.fg}cc)`;
    stEl.textContent = "正在上课 · " + periodLabel(current);
    subEl.textContent = current.sub + (current.t ? " · " + current.t : "");
    metaEl.textContent = `${current.start} — ${current.end}` + (current.note ? " · " + current.note : "");
    cLabel.textContent = "距下课";
    cDown.textContent = fmtDur((tm(current.end)-mins)*60);
    const ni = courses[courses.indexOf(current)+1];
    cSub.textContent = ni ? `下节：${ni.sub}（${ni.start}）` : "今天的最后一节课";
  } else if(next){
    hero.style.background = "linear-gradient(135deg,#6366f1,#8b5cf6 60%,#a855f7)";
    stEl.textContent = "课间 / 待上课";
    subEl.textContent = "下一节：" + next.sub;
    metaEl.textContent = `${periodLabel(next)} · ${next.start} — ${next.end}` + (next.t ? " · " + next.t : "");
    cLabel.textContent = "距上课";
    cDown.textContent = fmtDur((tm(next.start)-mins)*60);
    cSub.textContent = next.note ? ("备注：" + next.note) : "准备上课";
  } else {
    hero.style.background = "linear-gradient(135deg,#334155,#475569)";
    stEl.textContent = "已放学";
    subEl.textContent = "今日课程结束 ✅";
    metaEl.textContent = "辛苦了，好好休息";
    cLabel.textContent = "今日课程";
    cDown.textContent = courses.length + " 节";
    cSub.textContent = "明日见";
  }
}

// ================= 渲染：今日时间线 =================
function renderTimeline(){
  const box = document.getElementById("timeline");
  const hint = document.getElementById("dayHint");
  const now = new Date();
  const dow = todayDow();
  hint.textContent = selectedDow===null ? "点击课程看详情 · 点○切换掌握/复习" : "预览模式 · 点课程/○交互";

  if(dow===0 || dow===6){
    box.innerHTML = `<div class="empty-hint">周末没有课程安排。</div>`;
    return;
  }
  const courses = DAYS_COURSES[dow-1];
  const mins = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  if(!courses.length){ box.innerHTML = `<div class="empty-hint">今天没有课程安排。</div>`; return; }

  box.innerHTML = courses.map(c=>{
    const col = colorOf(c.sub);
    const st=tm(c.start), en=tm(c.end);
    const isNow = mins>=st && mins<en;
    const status = getStudyStatus(c);
    const hl = highlightSub===c.sub;
    return `<div class="tl-item ${isNow?'now':''} ${status==='done'?'done':''} ${hl?'hl':''}" data-idx="${courses.indexOf(c)}">
      <div class="tl-check ${status||''}" data-toggle="1">${status==='done'?'✓':(status==='review'?'!':'')}</div>
      <div class="tl-time">${c.start}<br>${c.end}</div>
      <div class="tl-badge" style="background:${col.bg}; color:${col.fg};">${c.sub}</div>
      <div class="tl-info">
        <div class="nm">${c.sub}${c.t ? ' · '+c.t : ''}</div>
        <div class="tc">${periodLabel(c)}${c.note ? ' · '+c.note : ''}</div>
      </div>
      <div class="tl-state">${isNow ? '正在上课' : (status==='done'?'已掌握':(status==='review'?'需复习':'待上课'))}</div>
    </div>`;
  }).join("");
}

// ================= 渲染：周课表（连堂合并） =================
function buildGrid(){
  const grid = [];
  for(let p=0;p<11;p++){ grid[p]=[null,null,null,null,null]; }
  DAYS_COURSES.forEach((courses,d)=>{
    courses.forEach(c=>{
      for(let p=c.p; p<c.p+c.span; p++) grid[p][d]=c;
    });
  });
  return grid;
}

function renderTable(){
  const wrap = document.getElementById("tblWrap");
  const tCol = todayDow()-1; // 0-4, 周末为 -1
  const grid = buildGrid();
  const skip = [0,0,0,0,0];

  let html = `<table><thead><tr><th>节次</th><th>时间</th>`;
  ["周一","周二","周三","周四","周五"].forEach((d,i)=>{
    html += `<th class="${i===tCol?'today':''}">${d}</th>`;
  });
  html += `</tr></thead><tbody>`;

  let lastGrp = "";
  PERIODS.forEach((P,pIdx)=>{
    if(P.grp !== lastGrp){
      html += `<tr class="grp-row"><td colspan="7">${P.grp}</td></tr>`;
      lastGrp = P.grp;
    }
    html += `<tr><td class="period-col"><div class="pn">第${P.n}节</div></td>`;
    html += `<td class="period-col"><div class="pt">${P.s}<br>${P.e}</div></td>`;
    for(let d=0;d<5;d++){
      if(skip[d]>0){ skip[d]--; continue; }
      const c = grid[pIdx][d];
      const rowspan = c ? c.span : 1;
      if(c && c.span>1) skip[d] = c.span-1;
      const col = c ? colorOf(c.sub) : {bg:"#fff", fg:"#c5cad6"};
      const hl = c && highlightSub===c.sub;
      const isTodayCol = d===tCol;
      if(c){
        const pEnd = c.p + c.span - 1;
        html += `<td class="cell ${hl?'hl':''} ${isTodayCol?'todaycol':''}" rowspan="${rowspan}" style="background:${col.bg};" data-d="${d}" data-p="${c.p}">
          <div class="cell-inner">
            ${c.span>1?`<span class="dbl">${c.span}节</span>`:''}
            <div class="sub" style="color:${col.fg};">${c.sub}</div>
            ${c.t?`<div class="t">${c.t}</div>`:''}
            ${c.note?`<div class="note">${c.note}</div>`:''}
          </div>
        </td>`;
      } else {
        html += `<td class="cell ${isTodayCol?'todaycol':''}" rowspan="1" data-d="${d}" data-p="${pIdx}"><div class="cell-inner"><div class="sub empty">—</div></div></td>`;
      }
    }
    html += `</tr>`;
  });
  html += `<tr><td colspan="7" style="text-align:center; color:#8a93a6; font-weight:700; padding:10px 8px; background:#fbfcfe;">备注：10:20—10:50 课间操</td></tr>`;
  html += `</tbody></table>`;
  wrap.innerHTML = html;

  const subs = [...new Set(DAYS_COURSES.flat().map(c=>c.sub))];
  const lg = document.getElementById("legend");
  lg.innerHTML = subs.map(s=>{
    const col = colorOf(s);
    return `<span class="chip ${highlightSub===s?'hl':''}" data-sub="${s}" style="background:${col.bg}; color:${col.fg};">${s}</span>`;
  }).join("");
}

// ================= 渲染：学习完成情况 =================
function renderStudy(){
  const dow = todayDow();
  const box = document.getElementById("studyList");
  const ring = document.getElementById("studyRing");
  const mini = document.getElementById("weekMini");

  // 本周概览
  mini.innerHTML = [1,2,3,4,5].map(d=>{
    const courses = DAYS_COURSES[d-1];
    const map = studySet[dateStrForDow(d)] || {};
    const done = courses.filter(c=>map[doneKey(c)]==='done').length;
    const total = courses.length;
    const pct = total ? Math.round(done/total*100) : 0;
    const cls = d===dow ? 'today' : (total && done===total ? 'done-all' : '');
    return `<div class="wm ${cls}"><div class="wd">周${WEEKCN[d]}</div><div class="pct">${total?pct+'%':'—'}</div><div class="n">${total?`${done}/${total}`:'休息'}</div></div>`;
  }).join("");

  const courses = (dow>=1 && dow<=5) ? DAYS_COURSES[dow-1] : [];
  const map = studySet[selectedDateStr()] || {};
  const done = courses.filter(c=>map[doneKey(c)]==='done').length;
  const review = courses.filter(c=>map[doneKey(c)]==='review').length;
  const total = courses.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const C = 2*Math.PI*40;
  const dash = total ? (done/total*C) : 0;
  ring.innerHTML = `
    <div class="ring">
      <svg width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="40" fill="none" stroke="#eef0f6" stroke-width="10"/>
        <circle cx="48" cy="48" r="40" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-dasharray="${dash} ${C-dash}"/>
      </svg>
      <div class="ring-num"><div class="big">${total?pct+'%':'—'}</div><div class="small">今日完成</div></div>
    </div>
    <div class="study-summary">
      <div class="line">今日共 <b>${total}</b> 节课</div>
      <div class="line">已掌握 <b style="color:#10b981;">${done}</b> 节</div>
      <div class="line">需复习 <b style="color:#f59e0b;">${review}</b> 节</div>
      <div class="line" style="color:var(--muted);font-size:12px;">剩余 ${total-done-review} 节待完成</div>
    </div>`;

  if(!courses.length){ box.innerHTML = `<div class="empty-hint">周末没有课程，好好休息～</div>`; return; }
  box.innerHTML = courses.map(c=>{
    const st = getStudyStatus(c);
    const col = colorOf(c.sub);
    return `<div class="study-row" data-idx="${courses.indexOf(c)}">
      <div class="s-dot ${st||''}">${st==='done'?'✓':(st==='review'?'!':'')}</div>
      <div class="s-name" style="color:${col.fg};">${c.sub}${c.t?' · '+c.t:''}</div>
      <span class="s-tag" style="background:${col.bg}; color:${col.fg};">${periodLabel(c)}</span>
      <span class="s-tag" style="background:#f1f3f8; color:${st==='done'?'#047857':(st==='review'?'#b45309':'#8a93a6')};">${st==='done'?'已掌握':(st==='review'?'需复习':'未学')}</span>
    </div>`;
  }).join("");
}

// ================= 渲染：待办 =================
function renderTodos(){
  const box = document.getElementById("todoList");
  if(!todos.length){ box.innerHTML = `<div class="empty-hint">还没有待办，点击课程「＋加到待办」或手动添加。</div>`; return; }
  box.innerHTML = todos.map((t,i)=>{
    const col = t.sub ? colorOf(t.sub) : null;
    return `<div class="todo-item">
      <div class="cb ${t.done?'on':''}" data-i="${i}">${t.done?'✓':''}</div>
      <div class="tx ${t.done?'done':''}">${esc(t.text)}</div>
      ${t.sub?`<span class="sub-tag" style="background:${col.bg}; color:${col.fg};">${t.sub}</span>`:''}
      <div class="del" data-del="${i}">✕</div>
    </div>`;
  }).join("");
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ================= Modal =================
function openModal(c){
  currentCourse = c;
  const col = colorOf(c.sub);
  document.getElementById("mSub").textContent = c.sub;
  document.getElementById("mSub").style.color = col.fg;
  document.getElementById("mTeacher").textContent = c.t || "—";
  document.getElementById("mTime").textContent = `${c.start} — ${c.end}`;
  document.getElementById("mPeriod").textContent = periodLabel(c);
  const nr = document.getElementById("mNoteRow");
  if(c.note){ nr.style.display=""; document.getElementById("mNote").textContent = c.note; }
  else { nr.style.display="none"; }
  document.getElementById("overlay").classList.add("show");
}
function closeModal(){ document.getElementById("overlay").classList.remove("show"); }

function addTodo(text, sub){
  if(!text.trim()) return;
  todos.push({text:text.trim(), done:false, sub:sub||null});
  saveJSON('cw_todos', todos);
  renderTodos();
}

function setHighlight(sub){
  highlightSub = (highlightSub===sub) ? null : sub;
  renderTable();
  renderTimeline();
}

// ================= 星期切换 =================
function renderWeekBar(){
  document.querySelectorAll(".wk-chip").forEach(ch=>{
    const v = ch.dataset.dow==="-1" ? null : parseInt(ch.dataset.dow,10);
    ch.classList.toggle("active", selectedDow===v);
  });
}

// ================= 事件绑定 =================
document.querySelectorAll(".wk-chip").forEach(ch=>{
  ch.addEventListener("click", ()=>{
    const v = ch.dataset.dow;
    selectedDow = v==="-1" ? null : parseInt(v,10);
    renderWeekBar();
    renderTable();
    renderTimeline();
    renderStudy();
    tick();
  });
});

document.getElementById("tblWrap").addEventListener("click", e=>{
  const cell = e.target.closest("td.cell");
  if(!cell) return;
  const d = parseInt(cell.dataset.d,10), p = parseInt(cell.dataset.p,10);
  const c = buildGrid()[p][d];
  if(c) openModal(c);
});

document.getElementById("timeline").addEventListener("click", e=>{
  const item = e.target.closest(".tl-item");
  if(!item) return;
  const dow = todayDow();
  const c = DAYS_COURSES[dow-1][parseInt(item.dataset.idx,10)];
  if(e.target.closest(".tl-check")){ setStudyStatus(c); return; }
  openModal(c);
});

document.getElementById("legend").addEventListener("click", e=>{
  const chip = e.target.closest(".chip");
  if(chip) setHighlight(chip.dataset.sub);
});

document.getElementById("studyList").addEventListener("click", e=>{
  const row = e.target.closest(".study-row");
  if(!row) return;
  const dow = todayDow();
  const c = DAYS_COURSES[dow-1][parseInt(row.dataset.idx,10)];
  setStudyStatus(c);
});

document.getElementById("mClose").addEventListener("click", closeModal);
document.getElementById("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeModal(); });
document.getElementById("mTodo").addEventListener("click", ()=>{
  if(currentCourse){ addTodo(`复习 ${currentCourse.sub}` + (currentCourse.t?`（${currentCourse.t}）`:''), currentCourse.sub); closeModal(); }
});
document.getElementById("mHighlight").addEventListener("click", ()=>{
  if(currentCourse){ setHighlight(currentCourse.sub); closeModal(); }
});

document.getElementById("todoBtn").addEventListener("click", ()=>{
  const inp = document.getElementById("todoInput");
  addTodo(inp.value, null);
  inp.value = "";
});
document.getElementById("todoInput").addEventListener("keydown", e=>{
  if(e.key==="Enter"){
    const inp = document.getElementById("todoInput");
    addTodo(inp.value, null);
    inp.value = "";
  }
});
document.getElementById("todoList").addEventListener("click", e=>{
  if(e.target.closest(".cb")){
    const i = parseInt(e.target.closest(".cb").dataset.i,10);
    todos[i].done = !todos[i].done;
    saveJSON('cw_todos', todos);
    renderTodos();
  } else if(e.target.closest(".del")){
    const i = parseInt(e.target.closest(".del").dataset.del,10);
    todos.splice(i,1);
    saveJSON('cw_todos', todos);
    renderTodos();
  }
});

// ================= 初始化 =================
renderWeekBar();
renderTable();
renderTimeline();
renderStudy();
renderTodos();
tick();
setInterval(()=>{ tick(); renderTimeline(); }, 1000);
</script>
